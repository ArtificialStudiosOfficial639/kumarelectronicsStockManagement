<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kumar Electronics - Invoice System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 🔵 LOADING SCREEN -->
<div id="loadingScreen">
  <img src="kelogo.png" alt="Logo">
  <div class="loader-bar">
    <div class="loader-fill"></div>
  </div>
  <p>Loading Invoice System...</p>
</div>

<!-- 🔴 MAIN APP -->
<div id="app" style="display:none;">

  <!-- HEADER -->
  <div class="invoice-header">
    <h1>Kumar Electronics</h1>
    <p>Electronics Sales & Service</p>

    <div class="invoice-info">
      <div>
        <label>Invoice No</label>
        <input id="invoiceNo" readonly>
      </div>
      <div>
        <label>Date</label>
        <input type="date" id="invoiceDate">
      </div>
    </div>

    <div class="customer-info">
      <div>
        <label>Customer Name</label>
        <input id="custName">
      </div>
      <div>
        <label>Mobile Number</label>
        <input id="custMobile">
      </div>
    </div>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <button id="addRowBtn">+ Add Item</button>
    <button onclick="window.print()">Print / Save</button>
  </div>

  <!-- ITEMS -->
  <table id="stockTable">
    <thead>
      <tr>
        <th>Item</th>
        <th>Qty</th>
        <th>Rate</th>
        <th>Total</th>
        <th>❌</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- GST -->
  <label>GST %</label>
  <input type="number" id="gstPercent" value="18" oninput="updateTotal()">

  <!-- SUMMARY -->
  <table class="summary">
    <tr><td>Sub Total</td><td><input id="subTotal" readonly></td></tr>
    <tr><td>CGST</td><td><input id="cgst" readonly></td></tr>
    <tr><td>SGST</td><td><input id="sgst" readonly></td></tr>
    <tr><td><b>Grand Total</b></td><td><input id="grandTotal" readonly></td></tr>
  </table>

  <button onclick="saveCustomer()">💾 Save Customer</button>

  <!-- 📊 MONTHLY REPORT -->
  <h2>Monthly Customer Report</h2>
  <table id="reportTable">
    <thead>
      <tr>
        <th>Date</th>
        <th>Name</th>
        <th>Mobile</th>
        <th>Amount</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

</div>

<script>
/* 🔄 Loading */
setTimeout(() => {
  document.getElementById("loadingScreen").style.display = "none";
  document.getElementById("app").style.display = "block";
}, 2000);

/* Invoice setup */
document.getElementById("invoiceNo").value =
  "KE-" + Date.now().toString().slice(-6);
document.getElementById("invoiceDate").value =
  new Date().toISOString().split("T")[0];

/* Add Row */
document.getElementById("addRowBtn").onclick = () => {
  let tr = document.createElement("tr");
  tr.innerHTML = `
    <td><input></td>
    <td><input type="number" oninput="updateTotal()"></td>
    <td><input type="number" oninput="updateTotal()"></td>
    <td><input readonly></td>
    <td><button onclick="this.closest('tr').remove();updateTotal()">X</button></td>
  `;
  document.querySelector("#stockTable tbody").appendChild(tr);
};

/* Calculation */
function updateTotal(){
  let rows = document.querySelectorAll("#stockTable tbody tr");
  let subtotal = 0;
  rows.forEach(r=>{
    let q = +r.children[1].children[0].value||0;
    let r1 = +r.children[2].children[0].value||0;
    let t = q*r1;
    r.children[3].children[0].value = t.toFixed(2);
    subtotal += t;
  });
  subTotal.value = subtotal.toFixed(2);
  let gst = subtotal*(gstPercent.value||0)/100;
  cgst.value = (gst/2).toFixed(2);
  sgst.value = (gst/2).toFixed(2);
  grandTotal.value = (subtotal+gst).toFixed(2);
}

/* 💾 Save Customer */
function saveCustomer(){
  let data = JSON.parse(localStorage.getItem("customers")||"[]");
  data.push({
    date: invoiceDate.value,
    name: custName.value,
    mobile: custMobile.value,
    amount: grandTotal.value
  });
  localStorage.setItem("customers",JSON.stringify(data));
  loadReport();
  alert("Customer saved successfully ✅");
}

/* 📊 Load Report */
function loadReport(){
  let tbody = document.querySelector("#reportTable tbody");
  tbody.innerHTML = "";
  let data = JSON.parse(localStorage.getItem("customers")||"[]");
  data.forEach(c=>{
    tbody.innerHTML += `
      <tr>
        <td>${c.date}</td>
        <td>${c.name}</td>
        <td>${c.mobile}</td>
        <td>₹${c.amount}</td>
      </tr>`;
  });
}
loadReport();
</script>

</body>
</html>
