<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kumar Electronics - Stock Sheet</title>
  <style>
    @media(max-width:600px){
      table, th, td{ font-size:14px; }
      input, select{ font-size:14px; }
      #addRowBtn, #savePdfBtn{ width:100%; margin-top:10px; }
    }
    body {
      font-family: Arial, sans-serif;
      background: white;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 12px;
      text-align: left;
      font-size: 16px;
    }
    th {
      background: #f1f1f1;
      font-weight: bold;
    }
    tfoot td {
      font-weight: bold;
      background: #f9f9f9;
    }
    input, select {
      width: 100%;
      padding: 8px;
      font-size: 16px;
      border: none;
      outline: none;
      background: transparent;
    }
    #addRowBtn {
      padding: 10px 20px;
      font-size: 16px;
      background: black;
      color: white;
      border: none;
      cursor: pointer;
      margin-bottom: 20px;
      border-radius: 6px;
    }
    #addRowBtn:hover {
      opacity: 0.8;
    }
    #savePdfBtn {
      padding: 10px 20px;
      font-size: 16px;
      background: #1976d2;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-left: 10px;
      margin-bottom: 20px;
    }
    #savePdfBtn:hover {
      opacity: 0.85;
    }
    label {
      font-weight: bold;
      margin-bottom: 5px;
      display: block;
    }
  </style>
</head>
<body>
  <header style="text-align:center; margin-bottom:20px;">
    <h1>Kumar Electronics - Stock Management Data</h1>
  </header>

  <button id="addRowBtn">+ Add New Item</button>
  <button id="savePdfBtn">Save as PDF</button>

  <div style="margin-bottom:20px;">
    <label for="monthSelect">Select Month</label>
    <select id="monthSelect">
      <option value="January">January</option>
      <option value="February">February</option>
      <option value="March">March</option>
      <option value="April">April</option>
      <option value="May">May</option>
      <option value="June">June</option>
      <option value="July">July</option>
      <option value="August">August</option>
      <option value="September">September</option>
      <option value="October">October</option>
      <option value="November">November</option>
      <option value="December">December</option>
    </select>
  </div>

  <table id="stockTable">
    <thead>
      <tr>
        <th>Name of Item</th>
        <th>Quantity</th>
        <th>Rate (&#8377;)</th>
        <th>Total (&#8377;)</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td><input type="text" value="" oninput="updateTotal()"></td>
        <td><input type="number" value="" oninput="updateTotal()"></td>
        <td><input type="number" value="" oninput="updateTotal()"></td>
        <td><input type="number" value="" readonly></td>
      </tr>
    </tbody>
    <tfoot>
      <tr>
        <td colspan="3">Grand Total (&#8377;)</td>
        <td><input type="number" id="grandTotal" readonly></td>
      </tr>
    </tfoot>
  </table>

  <script>
    function updateTotal() {
      let table = document.getElementById("stockTable");
      let rows = table.querySelectorAll("tbody tr");
      let grandTotal = 0;

      rows.forEach(row => {
        let qty = parseFloat(row.children[1].children[0].value) || 0;
        let rate = parseFloat(row.children[2].children[0].value) || 0;
        let total = qty * rate;
        row.children[3].children[0].value = total;
        grandTotal += total;
      });

      document.getElementById("grandTotal").value = grandTotal;
    }

    document.getElementById("addRowBtn").addEventListener("click", () => {
      let tableBody = document.querySelector("#stockTable tbody");
      let newRow = document.createElement("tr");

      newRow.innerHTML = `
        <td><input type="text" oninput="updateTotal()"></td>
        <td><input type="number" oninput="updateTotal()"></td>
        <td><input type="number" oninput="updateTotal()"></td>
        <td><input type="number" readonly></td>
      `;

      tableBody.appendChild(newRow);
    });
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>

  <script>
    document.getElementById("savePdfBtn").addEventListener("click", () => {
      const element = document.body;
      const options = {
        margin: 0.5,
        filename: 'Kumar_Electronics_Stock.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
      };
      html2pdf().set(options).from(element).save();
    });
  </script>
</body>
</html>
